name: CI

on:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [ main, dev ]  # feature branches are covered by their pull request
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m
      - name: Formatting
        run: make fmt-check
      - name: go.mod is tidy
        run: make tidy-check
      - name: Every release target builds without cgo
        run: make cross

  # Separate from hygiene because it uses the newest Go: govulncheck needs a
  # recent toolchain, and a standard-library vulnerability is only fixed by one.
  # It also runs weekly, so a newly published advisory shows up without a PR.
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - name: Known vulnerabilities in dependencies and the standard library
        run: make vuln

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # make test includes internal/acceptance (the exit-criterion walkthrough,
      # adversarial scenarios, air-gap check). MEI_REQUIRE_SOCKET_CHECK makes
      # lsof mandatory so the socket inspection can never be skipped silently.
      - name: Ensure lsof
        run: command -v lsof >/dev/null || sudo apt-get install -y lsof
      - name: Test
        env:
          MEI_REQUIRE_SOCKET_CHECK: "1"
        run: make test

  # A second implementation of the format's hashing and signing must agree with
  # the Go one on the known-answer vectors.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install blake3 cryptography
      - run: make vectors
